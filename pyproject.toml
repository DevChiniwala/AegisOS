[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "apps*", "models*", "services*", "packages*"]
exclude = ["tests*", "datasets*", "infrastructure*", "docs*"]

[project.scripts]
aegis = "apps.cli.__main__:main"

[project]
name = "aegisos"
version = "0.1.0"
description = "AegisOS - The Autonomous AI Operating System for Financial Intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "alembic",
    "structlog",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "httpx",
    "celery[redis]",
    "redis",
    "aioredis",
    "pyyaml",
    "networkx",
    "python-louvain",
    "numpy",
    "typer[all]",
    "rich",
]

[project.optional-dependencies]
ml = [
    "xgboost",
    "lightgbm",
    "catboost",
    "scikit-learn",
    "shap",
    "torch",
    "numpy",
    "pandas"
]
graph = [
    "networkx",
    "torch-geometric",
    "neo4j"
]
agents = [
    "openai",
    "anthropic",
    "langchain-core",
    "langchain-anthropic",
    "langchain-openai",
    "langgraph",
    "tiktoken",
    "faiss-cpu"
]
telemetry = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp"
]
mcp = [
    "mcp",
]
temporal = [
    "temporalio>=1.4.0",
]
compliance = [
    "z3-solver>=4.12.0",
]
causal = [
    "dowhy>=0.11",
    "econml>=0.15",
]
federated = [
    "nvflare>=2.4",
    "opacus",
]
all = [
    "xgboost",
    "lightgbm",
    "catboost",
    "scikit-learn",
    "shap",
    "torch",
    "numpy",
    "pandas",
    "networkx",
    "torch-geometric",
    "neo4j",
    "openai",
    "anthropic",
    "langchain-core",
    "langchain-anthropic",
    "langchain-openai",
    "langgraph",
    "tiktoken",
    "faiss-cpu",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp",
    "mcp",
    "temporalio>=1.4.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701", "E741", "E402", "F401"]

[tool.mypy]
strict = true
ignore_missing_imports = true
